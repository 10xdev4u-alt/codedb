name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-linux
          - os: macos-14
            target: aarch64-macos
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check Zig pin
        run: python3 scripts/zig_pin.py --check

      - name: Install Zig
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          version=$(python3 scripts/zig_pin.py --print)
          archive=$(python3 scripts/zig_pin.py --file "${TARGET}")
          sha256=$(python3 scripts/zig_pin.py --sha "${TARGET}")
          curl --fail --show-error --location --retry 3 \
            "https://ziglang.org/download/${version}/${archive}" -o "${archive}"
          echo "${sha256}  ${archive}" | shasum -a 256 --check
          tar -xf "${archive}"
          directory="${archive%.tar.xz}"
          echo "${PWD}/${directory}" >> "${GITHUB_PATH}"
          test "$("${directory}/zig" version)" = "${version}"

      - name: Build
        run: zig build -Doptimize=ReleaseFast

      - name: Test
        run: zig build test -Doptimize=ReleaseFast --summary all

  windows:
    name: build (windows-2022)
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check Zig pin
        shell: pwsh
        run: python scripts/zig_pin.py --check

      - name: Install Zig
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = (python scripts/zig_pin.py --print).Trim()
          $archive = (python scripts/zig_pin.py --file x86_64-windows).Trim()
          $expected = (python scripts/zig_pin.py --sha x86_64-windows).Trim()
          Invoke-WebRequest -Uri "https://ziglang.org/download/$version/$archive" -OutFile $archive
          $actual = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $expected) {
            throw "Zig checksum mismatch: expected $expected, got $actual"
          }
          Expand-Archive -Path $archive -DestinationPath .
          $directory = $archive -replace '\.zip$', ''
          "$PWD\$directory" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $installed = (& "$PWD\$directory\zig.exe" version).Trim()
          if ($installed -ne $version) {
            throw "Zig version mismatch: expected $version, got $installed"
          }

      - name: Build
        shell: pwsh
        run: |
          zig version
          zig build -Doptimize=ReleaseFast

      - name: Test (platform-neutral)
        shell: pwsh
        run: zig build test-core test-semantic -Doptimize=ReleaseFast --summary all

  eval-gate:
    name: eval gate (ubuntu-24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Gate the recorded development result
        run: >-
          python3 evals/gate.py
          --summary evals/results/2026-09-05-jina-round3-intent-development/summary.json
          --max-regression 0
          --min-delta 0.005

      - name: Test the gate
        run: python3 -m unittest discover -s evals -p 'test_eval_gate.py'
